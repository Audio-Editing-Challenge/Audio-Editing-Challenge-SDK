name: SDK checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest -q
      - name: Verify editable install outside the checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PYTHON'
          from aec_upload import policy_for_competition
          for track in ("aec_single_model", "aec_agent"):
              assert len(policy_for_competition(track).expected_ids) == 500
          PYTHON
